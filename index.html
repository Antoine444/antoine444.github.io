<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/AG.png" />
    <link rel="canonical" href="https://antoine444.github.io/" />
    <title>Antoine Garin</title>
    <meta name="description" content="Antoine Garin — MSc Computer Science at EPFL. Concurrent and distributed systems, machine learning, and quantitative finance." />
    <!-- Self-hosted subsets. Preloaded so the swap lands before first paint;
         crossorigin is required even same-origin or the preload is discarded
         and the file is fetched twice. -->
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Set the theme before first paint so there is no flash.
      // This site is designed dark, so with no choice on record we set dark
      // rather than following the OS. "system" is stored explicitly when the
      // reader picks it, which is what lets that choice survive a reload.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          } else if (stored !== 'system') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) { /* private mode: fall back to prefers-color-scheme */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
