<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Antoine Garin">
  <title>Antoine Garin</title>
  <!-- The versioned lock word reduced to a mark: a wide field, one small bit.
       The tab strip is light or dark independently of the page, so the mark
       inverts rather than picking one and hoping. -->
  <style>
    svg { --bg: #0B6E80; --fg: #FFFFFF; }
    @media (prefers-color-scheme: dark) { svg { --bg: #22D3EE; --fg: #08111A; } }
  </style>
  <rect width="32" height="32" rx="7" fill="var(--bg)"/>
  <rect x="6" y="12" width="15" height="8" rx="1.5" fill="var(--fg)"/>
  <rect x="23" y="12" width="4" height="8" rx="1.5" fill="var(--fg)" opacity="0.62"/>
</svg>
